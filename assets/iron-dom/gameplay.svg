<svg xmlns="http://www.w3.org/2000/svg" width="160" height="260" viewBox="0 0 160 260" role="img" aria-label="Iron Dom gameplay preview">
    <defs>
        <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#071523"/>
            <stop offset=".55" stop-color="#102b3e"/>
            <stop offset="1" stop-color="#17202f"/>
        </linearGradient>
        <linearGradient id="dome" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#47e6ff"/>
            <stop offset="1" stop-color="#7cf6c7"/>
        </linearGradient>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="160" height="260" rx="18" fill="url(#sky)"/>
    <rect x="10" y="10" width="140" height="240" rx="14" fill="none" stroke="#375268" stroke-width="1"/>

